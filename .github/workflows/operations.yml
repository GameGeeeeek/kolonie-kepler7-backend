name: Private operations checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check server.js
      - run: node tests/test_serverstart.js
      - name: Native frontend copy and gzip, including optional language catalogue
        run: node tests/test_deploy_gzip.js
      - name: Controlled catalogue deployment failures
        run: |
          git fetch --no-tags --depth=1 origin dda5d5d3c1dbfb5eeef9ecf5c88227014415c1ef
          node tests/check_deploy_language_counterexamples.cjs
      - name: Native optional WebP graphics deployment
        run: node tests/test_deploy_webp.js
      - name: Controlled WebP deployment failures
        run: node tests/check_deploy_webp_counterexamples.cjs
      - run: node --test tests/test_operations_admin.mjs tests/test_operations_guard.mjs tests/test_operations_releases.mjs tests/test_operations_http.mjs
      - name: Bounded content addressed archives and protected local upgrade
        run: |
          git fetch --no-tags --depth=1 origin f5d26daecce85d6a85fde3baa8a4d4c8d81ada52
          node --test tests/test_operations_archive_blobs.mjs tests/test_operations_archive_upgrade.mjs tests/test_operations_archive_readonly.mjs
      - name: Real legacy archive size failure and bounded candidate heap
        env:
          GG_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/kepler-release-archive-evidence
        run: |
          git fetch --no-tags --depth=1 origin f5d26daecce85d6a85fde3baa8a4d4c8d81ada52
          node tests/check_operations_archive_blob_counterexamples.cjs
      - name: Preserve original archive counterexample receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-archive-evidence
          path: ${{ runner.temp }}/kepler-release-archive-evidence
          if-no-files-found: warn
